[mypy]
python_version = 3.14
strict = True
warn_unreachable = True
# Home Assistant core is not fully typed for third party consumers.
disallow_untyped_calls = False
# casambi-bt and parts of Home Assistant re-export names without __all__.
implicit_reexport = True

# Home Assistant aliases voluptuous to probatio at runtime (2026.9+) and
# its flow helpers are typed against probatio. The standalone voluptuous
# package installed for tests has different types, so treat it as untyped.
[mypy-voluptuous.*]
follow_imports = skip
follow_imports_for_stubs = True
